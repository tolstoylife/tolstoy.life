    quoteEn: >-
      Luke XII, 49. My teaching, like fire, will set the world ablaze. (working English)
    significance: >-
      The CONDENSED Gospel in Brief collapses Luke 12:49: the first-person yearning ("how I wish it
      were kindled") is gone, "I" becomes "my teaching", the metaphor becomes a simile, and the verse
      is folded straight into the prophecy of discord (раздор). Set against the full harmony
      (harm-luke12-49), where Tolstoy keeps «и как желаю» and amplifies it into the spark of
      God-consciousness, the abridgement loses the inner longing. The same compression appears in the
      English (Maude) and French (abrege-luke12-49) condensations. See the cross-language comparison.
    facsimile: null

