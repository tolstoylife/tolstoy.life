  - id: brief-luke12-49
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    quoteRu: >-
