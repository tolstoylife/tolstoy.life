# ---------------------------------------------------------------------------------------------
# Layer 4 — scholarship (secondary). Finalized after the Phase-3 web sweep; sources verifiable.
# ---------------------------------------------------------------------------------------------
scholarship:
  summary: >-
    The received view treats Tolstoy's Gospel project (Соединение и перевод четырёх Евангелий, 1880-81;
    The Gospel in Brief) as a deliberately de-supernaturalized, rationalist rendering in which ethical
    teaching displaces theology (Wilson 1988: he "actually rewrote the gospels"; Bartlett 2010: "always
    a religious writer"). The one book-length study of the full harmony (Matual 1992) confirms the Logos
    is rendered «разумение» (comprehension). But the fire/light imagery is not analysed as a unifying
    figure in the accessible literature, and the systematic excision of hell-fire is not itemized as a
    distinct operation — both are points the corpus evidence supplies. The closest the literature comes
    to the fire-of-conscience motif is Bartolf & Miething (2023, "Flame of Truth"), on the Doukhobors.
    Read against this, the dive grounds in the primary record; the Sofia-centred popular frame
    (Popoff; The Last Station) and the contested "Tolstoyan" label are attributed, not endorsed.
  triangulation:
    - evidenceRef: harm-light-is-reason
      conventionalView: "Tolstoy renders the Logos of John 1:1 as «разумение» (comprehension), choosing it from eleven senses of λόγος; a rationalist, de-supernaturalized reading (Matual 1992; Maude's Gospel in Brief: 'Understanding is the light of truth')."
      relation: confirms
      source: "Matual, Tolstoy's Translation of the Gospels (1992); Wilson, Tolstoy (1988); Bartlett (2010)"
    - evidenceRef: harm-matt25-41
      conventionalView: "Scholarship notes general removal of supernatural elements but does not itemize the Gehenna / eternal-fire / unquenchable-fire excisions as a distinct, systematic operation."
      relation: extends
      source: "Critique of Dogmatic Theology (Tolstoy, 1880, Wikisource) supplies the rationale; no accessible secondary source itemizes the pattern"
    - evidenceRef: harm-luke12-49-commentary
      conventionalView: "No English-language study assembles Luke 12:49 across What I Believe / Kingdom of God / Path of Life / letters into one fire-of-conscience image-system; the nearest is a 2023 article on Doukhobor pacifism that quotes Tolstoy's fire-allegory but not the biblical genealogy."
      relation: extends
      source: "Bartolf & Miething, 'Flame of Truth' (2023)"
    - evidenceRef: vera-credo
