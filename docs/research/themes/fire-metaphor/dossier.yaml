    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_941_969_Abrege_de_lEvangile.txt
    quoteRu: >-
      Mon enseignement est comme le feu jeté dans le monde. Il fera beaucoup de ravages
    quoteEn: >-
      My teaching is like fire thrown into the world. It will do great damage [before it sets all men ablaze]. (working English) — source text is French
    significance: >-
      The French Abrégé de l'Évangile (Tolstoy's own condensed redaction) renders Luke 12:49 like the
      condensed Russian — no first-person yearning, fire as a simile for the teaching — but adds a
      harsher note the Russian omits: the fire «fera beaucoup de ravages» (will do great damage)
      before it envelops all humanity. Across all three languages the condensation subordinates the
      verse to the division-of-households sequence; only the full harmony keeps the longing. The
      quoteRu field holds French here (the evidence is cross-language); byte-verified against the extract.
    facsimile: null

