# ---------------------------------------------------------------------------------------------
# Intra-corpus contradictions (primary-vs-primary) — distinct from scholarship.
# ---------------------------------------------------------------------------------------------
contradictions:
  - claim: "Tolstoy preserves the Gospel's fire language."
    correction: >-
      He splits it. Judgment-fire (Gehenna, eternal/unquenchable fire, the furnace) is excised or
      naturalized (harm-matt25-41, harm-matt3-11, harm-gehenna-gloss, dogm-eternal-fire), while
      generative fire (Luke 12:49) is kept and amplified (harm-luke12-49-commentary). The same author
      removes one fire and magnifies the other.
    evidenceRef: harm-matt25-41
  - claim: "The Swedish edition's coda matches Tolstoy's Russian close of Bethink Yourselves."
    correction: >-
      The Russian reads «Не будем же противиться, а будем служить ему» (let us not resist but serve
      it); the Swedish edition renders it 'let us not extinguish it, but spread and sustain it' — a
      free translation/redaction variant, not a separate source.
    evidenceRef: odumaytes-fire-rising

