  - id: harm-light-is-reason
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_007_798_Soedinenie_i_perevod_chetyreh_evangelij.txt
    quoteRu: >-
      9) Φῶς — свет — по всем контекстам означает истинное разумение жизни.
    quoteEn: >-
      9) Φῶς — light — in all contexts means the true reason/understanding of life. (working English)
    significance: >-
      The programmatic hermeneutic key. In a translator's footnote to John 1, Tolstoy declares that
      "light" everywhere in the Gospel = "the true understanding of life" (разумение) — not the
      divine person nor supernatural radiance. Every light-rendering below follows from this rule.
    facsimile: null

