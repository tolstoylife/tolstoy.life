# Machine-readable dossier for the fire-metaphor corpus-dive (index.md).
# Created 2026-06-03 by a corpus-dive run (slug: fire-metaphor).
# Theme: Tolstoy's use of the FIRE metaphor and the adjacent LIGHT axis across the corpus,
# with special attention to how his own translation/harmony of the four Gospels recasts the
# Bible's fire/light language vs the standard (Synodal / Church-Slavonic) text.
# Every quoteRu is byte-faithful from the clean extract named in `extract` (verified by
# verify_quotes.py). quoteEn is working English (labelled). PSS Tom -> local PDF via
# pss-volume-mapping.md. Pre-reform / extractor-degraded entries are flagged in needsReview.

topic:
  slug: fire-metaphor
  title: "Fire and light in Tolstoy: the metaphor, and his rewriting of the Gospels"
  question: >-
    How does Tolstoy use the fire metaphor (and the adjacent light axis) across the local corpus,
    and how does his own translation/harmony of the four Gospels recast the Bible's fire and light
    language compared with the standard Synodal / Church-Slavonic text? Motivation: evaluating fire
    as an emblem for tolstoy.life.
  date: 2026-06-03
  period: prophet
  corpusSurface: [works, gospel-harmony, letters, diaries, krug_chtenija, fiction]
  dateRange: "1855–1910 (focus 1880–1910)"

