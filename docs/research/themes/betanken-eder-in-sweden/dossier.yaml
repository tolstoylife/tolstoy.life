topic:
  slug: betanken-eder-in-sweden
  title: "Betänken Eder! in Sweden, 1904, and the Swedish peace society's link to Tolstoy"
  question: >-
    Johan first asked why Svenska freds- och skiljedomsföreningen (SFSF) took the initiative to the Swedish Betänken Eder! (Stockholm 1904) and what happened around it. The 1904 evidence does not support that premise, and Johan then corrected it: he now places SFSF's involvement with Tolstoy around the Stockholm peace congress of 1909–10. The dive therefore asks (1) who actually brought Одумайтесь! to Swedish readers in 1904, and what was cut; (2) where SFSF and Tolstoy really met, in 1909–10; (3) the earlier Swedish thread and Tolstoy's own view of peace societies, in his words.
  date: 2026-10-24
  period: prophet
  corpusSurface: [letters, diaries, works, commentary, swedish-press-1904, swedish-catalogues, riksdag-print]
  dateRange: "1896–1910 (corpus); June 1904–April 1905 (Swedish press); 1908–1910 (congress)"

