scholarship:
  summary: >-
    No academic scholarship was consulted for this dive; the question is one of Swedish publishing history, which the 1904 newspapers and catalogues answer directly. Two Wikipedia articles were read for background on SFSF people (Carl Sundblad; Knut Sandstedt, said there to have represented the society at the Stockholm congress of 1910). The prior project work dive on Bethink Yourselves! is the nearest earlier account; where this dive corrects it, index.md says so.
  triangulation:
    - evidenceRef: sv_ght_1904_07_01
