  - id: sofia-1882-keystone
    genre: witness-diaries
    pssTom: null
    pages: null
    date: 1882-08-26
    addressee: null
    localPdf: null
    extract: extracts/tolstaya-s-a-diaries_1882-08-26.txt
    quoteRu: >-
      Он сегодня громко вскрикнул, что самая страстная мысль его о том, чтоб уйти от семьи. [...] Он проникся христианством и мыслями о самосовершенствованье. Я ревную его...
    quoteEn: >-
      Today he cried out aloud that his most passionate thought is to leave the family. […] He has become imbued with Christianity and with thoughts of self-perfection. I am jealous of it… (working English)
    significance: >-
      THE keystone of the family angle (26 Aug 1882, the 20th anniversary of her wedding diary). Sofia
      names the cause — "imbued with Christianity" — and ties it to the threat to leave and to her own
      jealousy of the religious mission. The single most direct primary witness to the work's domestic
      strain. (The same entry shows her also nursing the typhoid-stricken Ilya through the night.)
    facsimile: null

