# =============================================================================================
# Layer 4 — scholarship (secondary). English-first; attributed, read critically, never a baseline.
# =============================================================================================
scholarship:
  summary: >-
    Mainstream scholarship agrees the harmony (Соединение и перевод четырёх Евангелий, 1880–81) is a
    deliberately de-supernaturalized, rationalist rendering in which ethics displaces theology, and —
    crucially — that it is the PRODUCT of the conversion, not its cause: Matual (1992), the one
    book-length English study, writes that "Tolstoy's gospel did not lead to his religious views, but
    that his views gave rise to his gospels"; Wilson (1988) says he "actually rewrote the gospels";
    Gustafson (1986) resists the "two Tolstoys" split; Medzhibovskaya (2008) reframes the turn as a
    long, coherent "conversion" rather than a breakdown. On the FAMILY, a Sofia-centred popular frame
    (Popoff 2010; Shirer 1994; the film The Last Station, 2009) reads the religious turn as a domestic
    tragedy with Chertkov as villain and Sofia as victim. This dive grounds in the primary record and
    treats that frame critically: S. A. Tolstaya's own diary both names the cause ("проникся
    христианством") AND accepts it as "воля божья" — more ambivalent than the villain narrative, and
    the "Tolstoyan" label she and others used is one Tolstoy himself rejected.
  triangulation:
    - evidenceRef: gib-crisis-at-50
      conventionalView: "The harmony is the product of Tolstoy's conversion, not its cause (Matual: 'his views gave rise to his gospels')."
      relation: confirms
      source: "Matual, Tolstoy's Translation of the Gospels (1992)"
    - evidenceRef: harm-greek-lexicons
      conventionalView: "Tolstoy worked from the Koine Greek (assisted by a Greek tutor, I. M. Ivakin), harmonizing by ethical meaning and excising the supernatural — comparable to Jefferson's gospel (Britannica; Matual)."
      relation: confirms
      source: "Britannica, 'Union and Translation of the Four Gospels'; Matual (1992)"
    - evidenceRef: harm-reject-orthodoxy
      conventionalView: "The de-supernaturalizing/anti-dogmatic thrust is well-noted; it led to the 1901 excommunication (Wilson 1988)."
      relation: confirms
      source: "Wilson, Tolstoy (1988); Holy Synod decree, 1901"
    - evidenceRef: sofia-1882-keystone
      conventionalView: "The popular frame makes the religious turn a domestic tragedy with Chertkov the villain and Sofia the victim (Popoff; Shirer; The Last Station)."
      relation: complicates
      source: "Popoff, Sophia Tolstoy (2010); Shirer, Love and Hatred (1994)"
    - evidenceRef: harm-self-critical
      conventionalView: "Scholarship treats the harmony as confident rationalist exegesis; Tolstoy's own 1902 admission of 'artificial, probably incorrect' philology is rarely foregrounded."
      relation: extends
      source: "(the self-criticism is in the work's own 1902 preface; under-discussed in the accessible literature)"

# =============================================================================================
# Intra-corpus contradictions (primary-vs-primary).
# =============================================================================================
contradictions:
  - claim: "Tolstoy's gospel work was a private spiritual exercise that left the household untouched."
    correction: >-
      His own letters frame it as all-consuming and unpublishable (letter-strakhov-1879-passionate,
      letter-strakhov-1879-never-print), and from the other side S. A. Tolstaya's diaries record the
      estrangement, the threat to leave the family, and the work's endlessness (sofia-1882-keystone,
      sofia-1883-endless). The two voices, independently, document the same domestic strain.
    evidenceRef: sofia-1882-keystone

notCovered:
  - "The TEXTUAL fire/light rewrite of the Gospels (John 1 Logos→разумение, the hell-fire excisions, Luke 12:49) is owned by the sibling fire-metaphor dive and is only summarized here — not re-extracted."
  - "The edition/corpus anatomy (how Tom 24 sits in the 90-vol PSS, the TEI document model, the digitisation chain) is owned by the sibling jubilee-edition-tei-corpus dive; this dive cites its findings rather than repeating them."
  - "The copyright/will dimension of the family conflict (the 1891 renunciation, the contested will) is owned by the copyright-renunciation and biryukov-sofia-relationship dives; touched here only where the gospel work itself is the stressor."
  - "S. A. Tolstaya's diary is near-silent in 1879–1881 (the densest work years); the family evidence for that window leans on Tolstoy's letters to Strakhov and A. A. Tolstaya. A fuller pass over the children's memoirs (Ilya, Sergei, Tatyana Tolstoy) and Gusev's chronicle in the witness corpus remains."
  - "The downstream English Gospel-in-Brief lineage (Crowell 1896; Maude 1921; Condren 2011) and Wiener's complete 1904 harmony are documented from the local copies + web, but not collated line-by-line against the Russian."
  - "The SCANDINAVIAN / Swedish reception of the gospel work is unmapped. No standalone Swedish edition of the full harmony (Соединение и перевод четырёх Евангелий) was found in Project Runeberg or the Svenskt översättarlexikon; the condensed strand reached Swedish via Walborg Hedberg (Bonnier) — above all 'Anden af Kristi lära: en kommentarie öfver evangeliets mening' (Stockholm: Bonnier, 1891; KB-digitised), very likely the Gospel-in-Brief strand though the catalogues do not certify the Russian original — plus 'Hvari min tro består' (1887), 'Jesu lära: enkelt framställd' (Geber, 1909) and 'Kristi lära förklarad för barnen' (1910). Not collated; seeds a future 'Tolstoy's gospel work in Swedish' thread. NB the Swedish titles avoid 'evangelieharmoni'/'harmoni', reaching for 'lära' and 'evangeliets mening' — closer to Tolstoy's own соединение-by-meaning than to the harmonist tradition."

needsReview:
  - item: "Translator of the 1895–96 Walter Scott/Brotherhood 'Four Gospels Harmonised' is anonymous on the title page; secondary sources attribute it to John Coleman Kenworthy (Croydon Brotherhood Church)."
    phase: 3
    why: "Attribution is from secondary commentary, not title-page evidence; confirm against Matual (1992) or a Tolstoy-in-English bibliography before asserting in the vault."
  - item: "Geneva first-publication details: the censored full harmony first appeared abroad, commonly given as M. K. Elpidin's Geneva press, 1892–94; the Gospel in Brief earlier."
    phase: 3
    why: "Publisher/dates are standard in scholarship but were not confirmed against a primary catalogue in this run. First legal Russian printing = Jubilee Edition Tom 24, 1957 (confirmed from the local vol84 PDF cover)."
  - item: "The English translator's-note dating: 'written nearly eighteen years ago' (i.e. ~1876) vs the documented composition 1880–81."
    phase: 2
    why: "The translator counts loosely (probably from the conversion's onset); do NOT propagate 1876 — the harmony is 1880–81 (PSS Tom 24; Tolstoy's 1891 'From the Author' note says 'composed ten years ago')."
  - item: "I. M. Ivakin as Tolstoy's Greek tutor during the work."
    phase: 3
    why: "From secondary literature (Gale, 'Authoring Jesus'); confirm before stating as fact in a wiki page."
  - item: "1896 Crowell (New York) Gospel in Brief translator is anonymous; sometimes attributed to Isabel Hapgood — unconfirmed."
    phase: 3
    why: "Archive.org records it anonymous; the Hapgood attribution appears only in later editorial apparatus."
  - item: "Walter Scott edition coverage: Parts I–II (1895–96) carry the Preface, Introduction and ~Chapters I–VIII of XII; Part III never appeared."
    phase: 2
    why: "Confirm the exact final chapter of Part II if precise coverage is needed for an edition wiki page."

