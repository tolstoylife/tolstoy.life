# Machine-readable dossier for the gospel-translation corpus-dive (index.md).
# Created 2026-06-05 by a corpus-dive run (slug: gospel-translation).
# Theme: the HISTORY of Tolstoy's Bible/gospel-translation project (Соединение и перевод
# четырёх Евангелий, 1880–81, + the condensed Краткое изложение Евангелия), the strain it
# caused at home (in his family life), and its ENGLISH translation lineage. Two
# sibling dives own the adjacent ground: fire-metaphor (the textual fire/light rewrite) and
# jubilee-edition-tei-corpus (the edition/corpus anatomy); this dive cross-links them.
# Russian quoteRu rows are byte-faithful from the named extract (verify_quotes.py). English
# rows hold the English source text in quoteRu (per the Abrégé precedent in the fire dossier),
# verified against extracts/english-source-passages.txt (transcribed from the page images).
# PSS Tom -> local PDF via pss-volume-mapping.md (Tom 24 = vol84, Tom 23 = vol83, Tom 62 = vol28).

topic:
  slug: gospel-translation
  title: "Tolstoy and the Gospels: the translation project, its history, and the strain at home"
  question: >-
    How and why did Tolstoy come to translate and harmonize the four Gospels; what was his
    method; how did the work affect his family life; how is the project situated in the Jubilee
    Edition / TEI corpus; and what has been translated into English, by whom? The fire metaphor
    (its own dive) and the corpus/edition anatomy (its own dive) are cross-linked, not re-derived.
  date: 2026-06-05
  period: "conversion + prophet (focus 1878–1896; afterlife to 1957/2011)"
  corpusSurface: [works, gospel-harmony, diaries, letters, witness-diaries, english-editions]
  dateRange: "1878–1896 (composition 1880–81; first legal Russian printing 1957)"

# =============================================================================================
# Layer 1 — flat citation ledger.
#   A. The history & method of the project (Tom 23–24)
#   B. The strain at home (Tolstoy's diaries/letters + S. A. Tolstaya's witness diaries)
#   C. Into English (the local English editions; source text is English)
# =============================================================================================
evidence:

  # ===== A. THE HISTORY & METHOD OF THE PROJECT ===================================

  - id: harm-reject-orthodoxy
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_007_798_Soedinenie_i_perevod_chetyreh_evangelij.txt
    quoteRu: >-
      В православном вероучении я нашел изложение самых непонятных, кощунственных и безнравственных положений, не только не допускаемых разумом, но совершенно непостижимых и противных нравственности, и — никакого учения о жизни и о смысле ее.
    quoteEn: >-
      In the Orthodox creed I found an exposition of the most incomprehensible, blasphemous and immoral propositions — not only inadmissible to reason but utterly incomprehensible and contrary to morality — and no teaching whatever about life or its meaning. (working English)
    significance: >-
      The motive, stated in the Introduction to the harmony: Orthodox dogmatic theology gave him no
      teaching about life, so he resolved to go behind it to Christ's own words. The negative half of
      the project (the positive being the new translation itself).
    facsimile: null

  - id: harm-turn-to-gospels
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_007_798_Soedinenie_i_perevod_chetyreh_evangelij.txt
    quoteRu: >-
      обратился к изучению Евангелий.
    quoteEn: >-
      I turned to the study of the Gospels. (working English)
    significance: >-
      The pivot, in Tolstoy's own words in the Introduction: rejecting church mediation, he goes
      directly to the Gospel text. The decision that generated the whole project.
    facsimile: null

  - id: harm-greek-lexicons
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_007_798_Soedinenie_i_perevod_chetyreh_evangelij.txt
    quoteRu: >-
      Читал я по-гречески, на том языке, на котором оно есть у нас, и переводил так, как указывал смысл и лексиконы
    quoteEn: >-
      I read in Greek, the language in which we have it, and translated as the sense and the lexicons indicated. (working English)
    significance: >-
      The method in one sentence: he worked from the Koine Greek with lexicons, departing from the
      existing translations precisely because they were made after the church had fixed the meaning.
      (Secondary literature names I. M. Ivakin as his Greek tutor at Yasnaya Polyana — see needsReview.)
    facsimile: null

  - id: harm-four-into-one
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_007_798_Soedinenie_i_perevod_chetyreh_evangelij.txt
    quoteRu: >-
      я неизбежно был приведен к необходимости свести четыре Евангелия в одно, так как все они излагают, хотя и разноречиво, одни и те же события и одно и то же учение.
    quoteEn: >-
      I was inevitably led to the necessity of bringing the four Gospels together into one, since all of them set out, however divergently, the same events and the same teaching. (working English)
    significance: >-
      Why a HARMONY and not just a translation: the four accounts of one teaching had to be unified.
      The structural premise of the whole work.
    facsimile: null

  - id: harm-predecessors
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_007_798_Soedinenie_i_perevod_chetyreh_evangelij.txt
    quoteRu: >-
      Попыток соединения Евангелий в одно было много, но те все, которые я знаю, — Arnolde, de Vence, Фаррара, Рейса, Гречулевича, — все они берут исторические основы соединения, и все они безуспешны
    quoteEn: >-
      There have been many attempts to combine the Gospels into one, but all those I know — Arnolde, de Vence, Farrar, Reuss, Grechulevich — all take historical bases for the combination, and all are unsuccessful. (working English)
    significance: >-
      He differentiates his method from prior harmonies (Farrar, Reuss, Grechulevich): they harmonize
      by historical chronology; he harmonizes by the MEANING of the teaching. (He took Grechulevich's
      sequence as a base and cross-checked Reuss.)
    facsimile: null

  - id: harm-circle
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_007_798_Soedinenie_i_perevod_chetyreh_evangelij.txt
    quoteRu: >-
      учение истинное представляет как бы круг, которого все части одинаково определяют значение друг друга и для изучения которого безразлично начинание изучения с одного или другого места.
    quoteEn: >-
      the true teaching presents itself as a kind of circle, all of whose parts equally define one another's meaning, and for the study of which it is a matter of indifference where one begins. (working English)
    significance: >-
      The interpretive logic of the harmony: the teaching is an organic circle, not a chronology, so
      its order of assembly follows the meaning rather than the calendar.
    facsimile: null

  - id: harm-self-critical
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1902
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_007_798_Soedinenie_i_perevod_chetyreh_evangelij.txt
    quoteRu: >-
      искусственные и, вероятно, неправильные филологические разъяснения, которые не только не усиливают убедительность общего смысла, но должны ослаблять ее.
    quoteEn: >-
      artificial and probably incorrect philological explanations, which not only fail to strengthen the persuasiveness of the general sense but must weaken it. (working English)
    significance: >-
      Tolstoy's own retrospective verdict (the 1902 "Free Word" edition preface): he concedes he forced
      obscure passages with strained philology and would not do so again. A rare self-criticism of the
      project's method — the honest counterweight to the confident Introduction.
    facsimile: null

  - id: gib-crisis-at-50
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    quoteRu: >-
      Я был приведен к христианству не богословскими, не историческими исследованиями, а тем, что пятидесяти лет от роду [...] я пришел в отчаяние и хотел убить себя [...] И я стал изучать христианство
    quoteEn: >-
      I was brought to Christianity not by theological or historical investigations, but by the fact that, at fifty years of age […] I fell into despair and wanted to kill myself […] And I began to study Christianity. (working English)
    significance: >-
      The crisis that drove the project, from the Gospel-in-Brief preface: the harmony is the PRODUCT
      of the conversion, not its cause (the point scholarship — Matual 1992 — also makes). Cross-links
      the project's "Confession → переworot" framing in the sibling crisis dive.
    facsimile: null

  - id: gib-mud-and-silt
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    quoteRu: >-
      нашел незаконно соединенную с ним грязь и тину, которая одна заслоняла для меня его чистоту; рядом с высоким христианским учением я нашел связанное с ним чуждое ему безобразное учение еврейское и церковное.
    quoteEn: >-
      I found, illegitimately joined to it, mud and silt which alone obscured its purity for me; beside the lofty Christian teaching I found bound up with it an alien, ugly Jewish and ecclesiastical teaching. (working English)
    significance: >-
      The governing image of the whole enterprise: the pure spring of Christ's teaching choked by the
      "mud and silt" of church accretion, which the translation sets out to clear away.
    facsimile: null

  - id: gib-four-part-plan
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    quoteRu: >-
      перевод четырех Евангелий и соединение их в одно.
    quoteEn: >-
      the translation of the four Gospels and their combination into one. (working English)
    significance: >-
      Step 3 of the four-part project Tolstoy lays out in the preface: (1) the autobiographical account
      [Confession]; (2) the critique of church dogma [Critique of Dogmatic Theology]; (3) the
      translation+harmony itself; (4) the exposition of the teaching's true meaning [What I Believe].
      The harmony is the keystone of a tetralogy, not a standalone book.
    facsimile: null

  - id: gib-12-chapters
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    quoteRu: >-
      Разделение Евангелия на 12 или на 6 глав (соединяя по две главы в одну) вытекло само собою из смысла учения.
    quoteEn: >-
      The division of the Gospel into 12 chapters (or into 6, joining two chapters into one) emerged of itself from the meaning of the teaching. (working English)
    significance: >-
      The harmony's architecture: 12 chapters framed by the John 1 prologue and the 1 John epilogue —
      a structure Tolstoy says he did not impose but found in the teaching.
    facsimile: null

  - id: gib-lords-prayer
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    quoteRu: >-
      так называемая молитва господня есть не что иное, как в самой сжатой форме выраженное всё учение Иисуса в том самом порядке, в котором были расположены мною главы, и что каждое выражение молитвы соответствует смыслу и порядку глав.
    quoteEn: >-
      the so-called Lord's Prayer is nothing other than the whole teaching of Jesus expressed in the most condensed form, in the very order in which I had arranged the chapters, and each phrase of the prayer corresponds to the sense and order of the chapters. (working English)
    significance: >-
      The post-hoc confirmation Tolstoy reports with "surprise and joy": his 12-chapter outline maps
      onto the Lord's Prayer phrase by phrase — for him, internal proof that the structure was the
      teaching's own.
    facsimile: null

  - id: gib-50000-variants
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    quoteRu: >-
      разночтений евангельских книг насчитывают до пятидесяти тысяч.
    quoteEn: >-
      the variant readings of the Gospel books are counted at up to fifty thousand. (working English)
    significance: >-
      His textual-criticism warrant for independence from the canonical text: with ~50,000 variants and
      no autograph, no single received reading is sacrosanct — so a fresh translation is legitimate.
    facsimile: null

  - id: dogm-no-faith
    genre: works
    pssTom: 23
    pages: "60–303"
    date: 1880
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: >-
      кощунственные сочинения Вольтера, Юма, но никогда я не испытывал того несомненного убеждения в полном безверии человека, как то, которое я испытывал относительно составителей катехизисов и богословии
    quoteEn: >-
      the blasphemous writings of Voltaire and Hume — yet never did I feel such a certain conviction of a man's complete unbelief as the one I felt regarding the composers of catechisms and theologies. (working English)
    significance: >-
      From the Critique of Dogmatic Theology (project part 2). His verdict on the theologians whose
      apparatus he was clearing away: not even Voltaire or Hume struck him as so faithless. The
      polemical engine behind the harmony's de-dogmatizing.
    facsimile: null

  # ===== B. THE STRAIN AT HOME ===================================================

  - id: diary-1878-read-gospel
    genre: diaries
    pssTom: 48
    pages: "69–70"
    date: 1878-05-22
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol16/vol16.pdf
    extract: extracts/v48_069_070_1878_05_22.txt
    quoteRu: >-
      Читал Евангелие.
    quoteEn: >-
      Read the Gospel. (working English)
    significance: >-
      The two-word entry (22 May 1878) at the moment Tolstoy resumes his diary after a 13-year gap —
      the Gospel reading already at the centre of the new life. The entry goes on to set the eternal
      against "everything temporal." The private beginning of the public project.
    facsimile: null

  - id: letter-strakhov-1879-passionate
    genre: letters
    pssTom: 62
    pages: "471–472"
    date: 1879-02-13
    addressee: N. N. Strakhov
    localPdf: primary-sources/jubilee-edition/vol28/vol28.pdf
    extract: extracts/v62_489_N_N_Straxovu.txt
    quoteRu: >-
      работаю очень много и страстно, хотя ничего не пишу.
    quoteEn: >-
      I work very much and passionately, though I write nothing. (working English)
    significance: >-
      To his confidant Strakhov: the formula for the whole gospel phase — total, consuming labour that
      produces nothing publishable. From the household's side this was a husband absorbed and invisible,
      generating no income.
    facsimile: null

  - id: letter-strakhov-1879-never-print
    genre: letters
    pssTom: 62
    pages: "501–503"
    date: 1879-11
    addressee: N. N. Strakhov
    localPdf: primary-sources/jubilee-edition/vol28/vol28.pdf
    extract: extracts/v62_535_N_N_Straxovu.txt
    quoteRu: >-
      занят работой для себя, которой никогда не напечатаю.
    quoteEn: >-
      I am occupied with work for myself, which I shall never print. (working English)
    significance: >-
      The uncensorable status of the work, in his own words — which is exactly why it produced no return
      for a family whose finances Sofia managed. (S. A. Tolstaya names the same fact from her side:
      "this work is endless, because it cannot be printed" — see sofia-1883-endless.)
    facsimile: null

  - id: letter-aatolstaya-1879-stranger
