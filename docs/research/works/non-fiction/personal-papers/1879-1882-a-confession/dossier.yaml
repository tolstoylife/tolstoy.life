# ── needsReview (deferred human judgment; autonomous never blocks) ──────────
needsReview:
  - item: "1884 Elpidin title-page imprint wording — Genève vs Carouge."
    phase: 3
    why: "'Geneva (Elpidin) 1884' is well-supported (Elpidin's press was in Geneva from 1865), but the physical 1884 title page was not byte-confirmed; The PSS commentary gives Geneva for 1884 («впервые напечатана М. К. Элпидиным в Женеве в 1884 г.»); only the Genève vs Carouge wording on the title page remains open."
  - item: "Identity of the 'book exposing the deceivers' in the 1882 Alexandrine letter (conf-let-07)."
    phase: 2
    why: "May refer to A Confession or to the Critique of Dogmatic Theology (the larger anti-dogmatic work). Cited here for the censorship climate, not asserted as about A Confession specifically."
  - item: "The 1884–85 'banned from Russkaya Mysl no.1' letters (Tom 63 v63_184, v63_294) most likely concern What I Believe, not A Confession."
    phase: 1
    why: "A Confession's Russkaya Mysl episode was 1882. The sweep surfaced 1884–85 RM-ban letters that some editors read as What I Believe; excluded from the A Confession publication narrative to avoid conflation."
  - item: "Identity of the 'большое сочинение' finished by July 1881 (conf-let-05)."
    phase: 2
    why: "Identified in PSS notes as the Gospel union/translation (the larger theological work); A Confession was its preface/introduction («Вступление к ненапечатанному сочинению»). The извлечение is the Краткое изложение Евангелия."
  - item: "excommunicationRelated field value for the works/ record."
    phase: 4
    why: "The 1901 edict names no works; «Исповедь» is not among them. Proposed false with a note; a human should decide whether the field means 'named in the edict' (false) or 'part of the condemned teaching' (arguably true)."
  - item: "workRecord proposal SHAPE must be reshaped to the works/ schema before ingestion."
    phase: 4
    why: "Field NAMES are all real, but three values are simplified to flat arrays where the schema (tolstoy-works-schema.md) wants object arrays: titleAlternatives (objects with .title/.type/.language), bans (objects with banningAuthority/jurisdiction/banDate…), and relatedWorks (objects with .id/.relationshipType). The date sub-flags oldStyle/approximate ride on each date field here per the skill's convention and map to the record's flat sibling keys (…OldStyle / …Approximate). The human ingesting should reshape accordingly; the existing genre 'essay' was left unchanged (defensible)."
  - item: "Alexandrine (А. А. Толстая, cousin, 1817–1904) vs the existing 'Alexandra Tolstaya' page (daughter Alexandra Lvovna, 1884–1979)."
    phase: 4
    why: "Two different people. The cousin needs a NEW wiki page; do not merge into the daughter's record."
  - item: "Maude and Simmons quotations reached via secondary aggregation."
    phase: 3
    why: "Verbatim wording and page references should be confirmed against the printed editions before any are quoted in the wiki."

