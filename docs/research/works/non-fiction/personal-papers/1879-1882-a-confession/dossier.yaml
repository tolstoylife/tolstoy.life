# A Confession (Исповедь) — corpus-dive dossier
# Machine-readable companion to index.md. Primary evidence is byte-faithful
# (verify with: python3 docs/research/lib/verify_quotes.py docs/research/1879-1882-a-confession/dossier.yaml).
# Secondary/scholarly claims are attributed, not byte-checked (prototype rigor).

topic:
  slug: 1879-1882-a-confession
  title: "A Confession (Исповедь)"
  question: >-
    Document A Confession as a work across the local Tolstoy corpus — its
    genesis and composition, what the text says, its redactions, its
    publication / censorship / translation history, its reception (Russian
    society and the Church first), and its place in the Prophet-period canon —
    grounded in Tolstoy's own words, the Jubilee-Edition apparatus, the
    composition-window diaries and letters, and the project's prior dives.
  date: "2026-06-06"
  period: "Prophet period (post-1880); composition 1879–1882 (Old Style)"
  corpusSurface: "PSS Tom 23 (work, variants, commentary); diaries Tom 48–49; letters Tom 62–63; sibling work Tom 23; echoes Tom 26, 66"
  dateRange: "1877–1906 (composition roots to first legal Russian publication); later authorial verdict 1892"

# ── Evidence ledger (primary; byte-faithful) ────────────────────────────────
# extract paths are relative to this file's directory.
evidence:

  # — The work's own text: PSS Tom 23, pp. 1–59 —
  - id: conf-text-01
    genre: work
    pssTom: 23
    pages: "1 (ch. I)"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "Я был крещен и воспитан в православной христианской вере. Меня учили ей и с детства и во всё время моего отрочества и юности. Но когда я 18-ти лет вышел со второго курса университета, я не верил уже ни во что из того, чему меня учили."
    quoteEn: "(working English) I was baptized and brought up in the Orthodox Christian faith. I was taught it from childhood and throughout my boyhood and youth. But when, at eighteen, I left the second year of university, I no longer believed in anything I had been taught."
    significance: "The opening sentences; the autobiographical frame — cradle faith already gone before the crisis begins."

  - id: conf-text-02
    genre: work
    pssTom: 23
    pages: "ch. II"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "Без ужаса, омерзения и боли сердечной не могу вспомнить об этих годах. Я убивал людей на войне, вызывал на дуэли, чтоб убить, проигрывал в карты, проедал труды мужиков, казнил их, блудил, обманывал."
    quoteEn: "(working English) I cannot recall those years without horror, loathing, and heartache. I killed men in war, challenged men to duels in order to kill them, lost at cards, devoured the labour of the peasants, punished them, fornicated, deceived."
    significance: "The confessional self-indictment that gives the work its tone — an inventory, not literary description."

  - id: conf-text-03
    genre: work
    pssTom: 23
    pages: "ch. III"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "Эти остановки жизни выражались всегда одинаковыми вопросами: Зачем? Ну, а потом?"
    quoteEn: "(working English) These stoppages of life always expressed themselves in the same questions: Why? And then what?"
    significance: "The germ of the crisis — the «остановка жизни» (arrest of life) and its recurring unanswerable questions."

  - id: conf-text-04
    genre: work
    pssTom: 23
    pages: "ch. IV"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "Жизнь моя остановилась. Я мог дышать, есть, пить, спать, и не мог не дышать, не есть, не пить, не спать; но жизни не было, потому что не было таких желаний, удовлетворение которых я находил бы разумным."
    quoteEn: "(working English) My life came to a stop. I could breathe, eat, drink, sleep, and could not help breathing, eating, drinking, sleeping; but there was no life, because there were no desires whose satisfaction I found reasonable."
    significance: "The precise statement of the spiritual paralysis at the centre of the book."

  - id: conf-text-05
    genre: work
    pssTom: 23
    pages: "ch. IV"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "И это сделалось со мной в то время, когда со всех сторон было у меня то, что считается совершенным счастьем: это было тогда, когда мне не было пятидесяти лет."
    quoteEn: "(working English) And this happened to me at a time when, on every side, I had what is considered perfect happiness: it was when I was not yet fifty."
    significance: "The paradox at the heart of the book — despair at the summit of worldly fortune, not in adversity."

  - id: conf-text-06
    genre: work
    pssTom: 23
    pages: "ch. IV"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "И я пытаюсь сосать тот мед, который прежде утешал меня; но этот мед уже не радует меня, а белая и черная мышь — день и ночь — подтачивают ветку, за которую я держусь."
    quoteEn: "(working English) And I try to suck the honey that once comforted me; but this honey no longer gladdens me, while the white mouse and the black — day and night — gnaw at the branch I cling to."
    significance: "The parable of the traveller, the well, the dragon and the two mice — the book's central enduring image, here applied to himself."

  - id: conf-text-07
    genre: work
    pssTom: 23
    pages: "ch. V"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "Есть ли в моей жизни такой смысл, который не уничтожался бы неизбежно предстоящей мне смертью?"
    quoteEn: "(working English) Is there in my life any meaning that would not be destroyed by the death inevitably awaiting me?"
    significance: "The sharpest single formulation of the book's governing question."

  - id: conf-text-08
    genre: work
    pssTom: 23
    pages: "ch. IX"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "Разумное знание привело меня к признанию того, что жизнь бессмысленна, жизнь моя остановилась, и я хотел уничтожить себя. Оглянувшись на людей, на всё человечество, я увидал, что люди живут и утверждают, что знают смысл жизни."
    quoteEn: "(working English) Rational knowledge led me to acknowledge that life is senseless; my life came to a stop and I wanted to destroy myself. Looking round at people, at all of humanity, I saw that people live and affirm that they know the meaning of life."
    significance: "The pivot — the turn from reason's verdict toward the lived faith of the labouring people."

  - id: conf-text-09
    genre: work
    pssTom: 23
    pages: "ch. IX"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "вера есть знание смысла человеческой жизни, вследствие которого человек не уничтожает себя, а живет. Вера есть сила жизни."
    quoteEn: "(working English) faith is the knowledge of the meaning of human life, by virtue of which a person does not destroy himself but lives. Faith is the force of life."
    significance: "Tolstoy's working definition of faith — reframed as the life-sustaining force, not dogma."

  - id: conf-text-10
    genre: work
    pssTom: 23
    pages: "ch. XI"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "Я заблудился не столько оттого, что неправильно мыслил, сколько оттого, что я жил дурно."
    quoteEn: "(working English) I went astray not so much because I thought wrongly as because I lived badly."
    significance: "The moral diagnosis — the error was in the life, not the logic; a hinge of the conversion."

  - id: conf-text-11
    genre: work
    pssTom: 23
    pages: "ch. XII"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "Он — то, без чего нельзя жить. Знать бога и жить — одно и то же. Бог есть жизнь."
    quoteEn: "(working English) He is that without which one cannot live. To know God and to live are one and the same thing. God is life."
    significance: "The climactic recognition that saves him from suicide."

  - id: conf-text-12
    genre: work
    pssTom: 23
    pages: "ch. XV"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "И русские стали во имя христианской любви убивать своих братьев."
    quoteEn: "(working English) And Russians began, in the name of Christian love, to kill their brothers."
    significance: "The concrete trigger of the break with the Church — its blessing of war and killing."

  - id: conf-text-13
    genre: work
    pssTom: 23
    pages: "ch. XVI (closing dream)"
    date: "1879–1882"
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: "Бесконечность внизу отталкивает и ужасает меня; бесконечность вверху притягивает и утверждает меня."
    quoteEn: "(working English) The infinity below repels and terrifies me; the infinity above draws me and affirms me."
    significance: "The crux of the closing dream — the image on which the whole confession comes to rest."

  # — Letters: genesis & circulation (PSS Tom 62–63) —
  - id: conf-let-01
    genre: letter
    pssTom: 62
    pages: "379–383"
    date: "1878-01-27 (OS)"
    addressee: "N. N. Strakhov"
    extract: extracts/v62_385_N_N_Straxovu.txt
    quoteRu: "Разум мне ничего не говорит и не может сказать на три вопроса, которые легко выразить одним: что я такое?"
    quoteEn: "(working English) Reason tells me nothing, and can say nothing, to the three questions that may easily be put as one: what am I?"
    significance: "The crisis-question «что я такое?» a year before drafting; same letter: «Я об этом начал писать и написал довольно много». A working title of the work was «Что я?»."

  - id: conf-let-02
    genre: letter
    pssTom: 62
    pages: "501–503"
    date: "1879-11-19 (OS, unsent)"
    addressee: "N. N. Strakhov"
    extract: extracts/v62_535_N_N_Straxovu.txt
    quoteRu: "Я очень занят работой для себя, которой никогда не напечатаю"
    quoteEn: "(working English) I am very busy with work for myself, which I will never print."
    significance: "The autumn-1879 drafting, named as private «работа для себя» — the self-description he used of A Confession before Chertkov persuaded him to publish. The letter was left unsent."

  - id: conf-let-03
    genre: letter
    pssTom: 62
    pages: "500–501"
    date: "1879-11-01 (OS)"
    addressee: "N. N. Strakhov"
    extract: extracts/v62_533_N_N_Straxovu.txt
    quoteRu: "Я очень занят, но не скажу, что пишу"
    quoteEn: "(working English) I am very busy, but I will not say what I am writing."
    significance: "Protective secrecy about the work in progress, November 1879."

  - id: conf-let-04
    genre: letter
    pssTom: 62
    pages: "503–504"
    date: "1879-11-22 (OS)"
    addressee: "A. A. Fet"
    extract: extracts/v62_536_A_A_Fetu.txt
    quoteRu: "Я очень занят. Из занятия моего ничего не выйдет, кроме моего удовлетворения, но все-таки очень занят."
    quoteEn: "(working English) I am very busy. Nothing will come of my occupation except my own satisfaction, but I am very busy all the same."
    significance: "The same secret work, the same week, to a different correspondent (Fet) — corroborating the active autumn-1879 drafting."

  - id: conf-let-05
    genre: letter
    pssTom: 63
    pages: "71–73"
    date: "1881-07-01/08 (OS)"
    addressee: "N. N. Strakhov"
    extract: extracts/v63_060_H_N_Straxovu.txt
    quoteRu: "Из большего сочинения, которое я после вас и кончил, и еще раз все прошел, я сделал еще из Евангелия извлечение без примечаний"
    quoteEn: "(working English) Out of the larger work, which I finished after seeing you and have gone through once more, I have made besides an extract from the Gospel without notes."
    significance: "By July 1881 the larger theological work was finished; same letter reports the Optina Pustyn pilgrimage («путешествие в Оптину пустынь»). The Jubilee editors tie the finished form of A Confession to this moment, as the preface to the Краткое изложение Евангелия."

  - id: conf-let-06
    genre: letter
    pssTom: 63
    pages: "80–83"
    date: "1881-11 (OS)"
    addressee: "V. I. Alekseev"
    extract: extracts/v63_079_V_I_Alekseevu.txt
    quoteRu: "Мне очень тяжело в Москве."
    quoteEn: "(working English) Things are very hard for me in Moscow."
    significance: "The Moscow despair of the move (echoing the work's urban horror). Same letter names the forming circle — N. F. Fedorov, the peasant Sutaev, Orlov. Orlov and Fedorov had read his «Краткое изложение» and were «единомышленны» (of one mind) with him; with Sutaev «во всем до малейших подробностей»."

  - id: conf-let-07
    genre: letter
    pssTom: 63
    pages: "90–91"
    date: "1882-03-03 (OS, unsent)"
    addressee: "A. A. Tolstaya (Alexandrine)"
    extract: extracts/v63_094_Gr_A_A_Tolstoj.txt
    quoteRu: "Обличаемые спрятались за цензуру и штыки"
    quoteEn: "(working English) Those exposed have hidden behind censorship and bayonets."
    significance: "Tolstoy's combative stance toward the Church and the censor in spring 1882, while his anti-dogmatic writing was being suppressed. (Which 'book exposing the deceivers' the letter means — A Confession or the Critique of Dogmatic Theology — is not certain; see needsReview.)"

  - id: conf-let-08
    genre: letter
    pssTom: 63
    pages: "112–128"
    date: "1882-12 (OS)"
    addressee: "M. A. Engelhardt"
    extract: extracts/v63_140_M_A_Engelgardtu.txt
    quoteRu: "значение его в том, чтобы найти смысл жизни в этом мире. Исполнение пяти заповедей дает этот смысл."
    quoteEn: "(working English) its significance is in finding the meaning of life in this world. Fulfilment of the five commandments gives that meaning."
    significance: "The doctrine that follows from the Confession's resolution, stated in an epistolary manifesto; the «смысл жизни» formula is the work's own. Belongs to the cluster's next panel (What I Believe)."

  # — Diaries: composition-window interior (PSS Tom 48–49) —
  - id: conf-diary-01
    genre: diary
    pssTom: 48
    pages: "69–70"
    date: "1878-05-22 (OS)"
    extract: extracts/v48_069_070_1878_05_22.txt
    quoteRu: "Начал писать «свою жизнь»."
    quoteEn: "(working English) Began to write 'my life'."
    significance: "The earliest datable composition reference in the corpus window; same entry: «Читал Евангелие» and the reflection on church unity. The diary then falls silent across 1879–1880."

  - id: conf-diary-02
    genre: diary
    pssTom: 49
    pages: "58"
    date: "1881-10-05 (OS)"
    extract: extracts/v49_058_058_1881_10_05.txt
    quoteRu: "Прошел месяц — самый мучительный в моей жизни. Переезд в Москву."
    quoteEn: "(working English) A month has passed — the most agonizing of my life. The move to Moscow."
    significance: "The Moscow move as moral catastrophe, the diary resumed after the long gap; same entry names Fedorov («святой») and the visit to Sutaev («Был в Торжке у Сютаева, утешенье»)."

  - id: conf-diary-03
    genre: diary
    pssTom: 49
    pages: "59"
    date: "1882-12-22 (OS)"
    extract: extracts/v49_059_059_1882_12_22.txt
    quoteRu: "Опять пережил муки душевные ужасные. Больше месяца. Но не бесплодные."
    quoteEn: "(working English) Again I have lived through terrible spiritual torments. More than a month. But not fruitless ones."
    significance: "Late-crisis marker; the «Сей, сей» (Sow, sow) passage on doing good without seeing its fruit — the resolution maturing after the work was complete."

  # — Sibling work & cluster (PSS Tom 23) —
  - id: conf-sib-01
    genre: work
    pssTom: 23
    pages: "304 (opening of «В чём моя вера?»)"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "Пять лет тому назад я поверил в учение Христа — и жизнь моя вдруг переменилась"
    quoteEn: "(working English) Five years ago I came to believe in Christ's teaching — and my life suddenly changed."
    significance: "What I Believe (the cluster's next panel) opens where A Confession ends — at the moment faith was recovered — and pins the temporal link ('five years ago')."

  # — Echoes across the corpus —
  - id: conf-echo-01
    genre: letter
    pssTom: 66
    pages: "188–189"
    date: "1892-04-01 (OS)"
    addressee: "Georges Dumas (written in French; Russian per PSS)"
    extract: extracts/v66_228_ZH_DyumaDumas.txt
    quoteRu: "перемена, о которой я говорю в «Исповеди», произошла не сразу, но что те же идеи, которые яснее выражены в моих последних произведениях, находятся в зародыше в более ранних."
    quoteEn: "(working English) the change I speak of in The Confession did not happen all at once, but the same ideas, expressed more clearly in my later works, are present in embryo in the earlier ones."
    significance: "Tolstoy's own later verdict (1892) on the work — the change was gradual, not sudden — endorsing the embryo-in-the-earlier-work reading."

  - id: conf-echo-02
    genre: work
    pssTom: 26
    pages: "466–474"
    date: "c.1884–1886"
    extract: extracts/v26_466_474_Zapiski_sumashedshego.txt
    quoteRu: "И вдруг арзамасский ужас шевельнулся во мне."
    quoteEn: "(working English) And suddenly the Arzamas horror stirred in me."
    significance: "Notes of a Madman — the only extended creative-prose return to the 1869 Arzamas terror that prefigures the crisis. Distinct imagery from A Confession's «остановка жизни»; do not conflate."

# ── Intra-corpus contradictions (primary vs primary) ────────────────────────
contradictions:
  - claim: "A Confession (and the opening of What I Believe, «жизнь моя вдруг переменилась») presents the change as a sudden turn."
    correction: "Tolstoy's 1892 letter to Dumas says the change «произошла не сразу» — gradual, present «в зародыше» in earlier works."
    evidenceRef: "conf-sib-01 / conf-echo-01"

