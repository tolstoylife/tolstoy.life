# ── Scholarship (secondary layer; attributed, not byte-checked) ─────────────
scholarship:
  summary: >-
    The mainstream English biographical frame (Maude 1908–10; Simmons 1946;
    Wilson 1988; Bartlett 2011) treats A Confession as the threshold document of
    Tolstoy's 'conversion' — a mid-life crisis after Anna Karenina resolved into
    a non-dogmatic Gospel faith. The key specialist corrective is Inessa
    Medzhibovskaya's A Biography of a Long Conversion (2008), which reframes the
    event as a decades-long philosophical project rather than a crisis-begotten
    rupture — the position closest to this dive's primary findings. Gustafson
    (1986) and Orwin (1993) likewise stress pre-1880 continuity. The Sofia-
    centred 'moralistic dogmatist' picture and the retrospective 'Tolstoyanism'
    label are later, partly hostile constructions to be attributed, not adopted.
  triangulation:
    - evidenceRef: conf-echo-01
      conventionalView: "Popular biography frames the change as a sudden post-Anna Karenina crisis; specialist scholarship (Medzhibovskaya) argues a long, gradual conversion."
      relation: confirms
      source: "Medzhibovskaya 2008; Gustafson 1986; Orwin 1993"
    - evidenceRef: conf-text-03
      conventionalView: "English scholarship uses 'crisis'/'conversion' as settled category-words; none register that Tolstoy's own word was «переворот» (an overturning, not religious-technical 'conversion')."
      relation: complicates
      source: "Maude; Simmons; Wilson; Bartlett (terminology); cf. project crisis dive"
    - evidenceRef: conf-text-12
      conventionalView: "Reference and rare-book records corroborate the suppression spine: typeset for Russkaya Mysl 1882 and cut by Church censorship; Geneva (Elpidin) 1884; first legal Russian publication 1906 (Vsemirny Vestnik no. 1)."
      relation: confirms
      source: "Wikipedia, Confession (Leo Tolstoy); Lorne Bair Rare Books catalogue"

