topic:
  slug: 1905-the-great-sin
  title: "The Great Sin (Великий грех)"
  question: >-
    What does Tolstoy say in The Great Sin (1905), in his own terms? He calls
    private property in land «великий грех» — the great sin, the surviving form
    of slavery, the root of the people's poverty and the 1905 unrest — and says
    the cure is not legislation but the awakened conscience of those who profit
    from it, as with serfdom. Henry George's single tax enters only as a
    conditional concession «при существующем государственном строе» — given a
    state and taxes that already exist, the least unjust way to hold land. (The
    academic framing of this as "anarchism vs. a state fiscal reform" is recorded
    as an attributed contrast, not the dive's spine.)
  date: 2026-06-21
  period: "Prophet period (post-1880); written during the 1905 Revolution"
  corpusSurface: >-
    The work itself (PSS Tom 36, pp. 206–230); its variants (Tom 36, pp.
    464–475) and composition-history commentary (Gorbachev, Tom 36, pp.
    656–665); the 1905 diaries (Tom 55) and the 1905 letters to Chertkov (Tom
    89) for genesis and the people around the work; prior corpus-dives for the
    cluster; English-first scholarship for the received view.
  dateRange: "1905-04-21 .. 1905-07 (composition); July 1905 (first publication)"

