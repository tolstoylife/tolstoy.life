# ── Scholarship (secondary layer; ground in primary first, attribute) ─────
scholarship:
  summary: >-
    The specialist English study is Kenneth Wenzer, "Tolstoy's Georgist Spiritual
    Political Economy (1897–1910): Anarchism and Land Reform" (Am. J. of Economics
    and Sociology, 1997) — the dive's main scholarly point of contrast. On one
    point scholarship simply agrees with the corpus: George and the single tax were
    a lifelong, often-restated Tolstoy commitment (read «по Николаеву» from the
    mid-1880s, intensified after George's 1897 death; To the Working People 1902,
    the 1906 prefaces, the 1909 dream-conversation diary), not a one-off 1905
    intervention. Where scholarship turns the essay into a debate, the dive does not
    follow it into the academy's vocabulary: Wenzer reads the single-tax endorsement
    as a "concession/weakness" and a contradiction of Tolstoy's "anarchism"; the
    single-tax movement's own commentary (Lebrun) reads the same endorsement as
    genuine and foundational. Both argue Tolstoy's intent in the abstract, in terms
    (anarchism, concession, contradiction) that are theirs, not his — recorded here
    attributed and read critically, never as the dive's spine. The corpus reaches
    below where the debate stops: Chertkov set the inward-only paragraph apart and
    recorded his reason (E15, E28), and the 1905 English translator's footnote
    already flagged the «existing state structure» conditionality — the conditional
    reading is in the 1905 apparatus, not a later invention. (The Sofia-centred
    "moralist who impoverished his family" frame does not arise here.)
  triangulation:
    - evidenceRef: E12
      conventionalView: "The single-tax endorsement contradicts (or at best sits unresolved with) Tolstoy's Christian-anarchist rejection of state coercion; Wenzer reads it as a 'concession/weakness' within a two-stage logic Tolstoy never philosophically resolved ('compartmentalized')."
      relation: complicates
      source: "Wenzer 1997 (Am. J. Econ. & Sociology 56:4); the 1905 English 'A Great Iniquity' translator's footnote"
    - evidenceRef: E15
      conventionalView: "Scholarship debates Tolstoy's intent in the abstract (concession vs. genuine endorsement) but cannot pin the mechanism."
      relation: extends
      source: "Wenzer 1997 ('unresolved'); the PSS variant apparatus (Tom 36, var. № 15) + Chertkov's documented cut"
    - evidenceRef: E20
      conventionalView: "The essay's reception is usually given as 'published in Russian Thought 1905.'"
      relation: complicates
      source: "tolstoy.ru journalism guide — the editors' disclaimer AND their excision of the «Так думают либералы…» paragraph (a Russian-side cut paralleling Chertkov's English-side cut)"
    - evidenceRef: E3
      conventionalView: "Tolstoy's Georgism is a lifelong commitment via Nikolaev's translations; he is, after George's 1897 death, the movement's foremost literary champion."
      relation: confirms
      source: "Wenzer 1997; Lebrun 1956"
    - evidenceRef: E13
      conventionalView: "The serfdom→land-emancipation analogy is read as Tolstoy's rhetorical frame for moral (not legislative) change; the movement reads land-liberation as a genuine, permanent solution like serf-emancipation."
      relation: complicates
      source: "Lebrun 1956 (Prosper Australia) — movement reading, read critically as an interested party"

