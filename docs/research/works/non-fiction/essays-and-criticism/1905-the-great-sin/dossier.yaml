evidence:
  # --- the work itself (PSS Tom 36) ---
  - id: E1
    genre: works
    pssTom: 36
    pages: "206"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "есть лишение большинства народа несомненного, естественного права каждого человека пользоваться частью той земли, на которой он родился"
    quoteEn: "is the deprivation of the majority of the people of the unquestionable, natural right of every man to use part of the land on which he was born (working English)"
    significance: "Introduction. The thesis stated flat: the basic evil — under which Russia, Europe and America all suffer — is not political oppression but the denial of the natural right to land. Everything else in the essay hangs from this."
  - id: E2
    genre: works
    pssTom: 36
    pages: "209"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "Хлеба не хватает, а хлеба не хватает оттого, что земли нет"
    quoteEn: "There is not enough bread, and there is not enough bread because there is no land (working English)"
    significance: "Ch. I close. The argument's empirical floor — the Palm-Saturday road to Tula, the peasants selling their last cow and horse, every story reduced to the one cause. Tolstoy grounds the abstraction in reported peasant speech before he reaches for George."
  - id: E3
    genre: works
    pssTom: 36
    pages: "210"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "Мы толкуем об отмене рабства, но мы не отменили рабства, мы отменили лишь более грубую форму его: личное рабство"
    quoteEn: "We talk of the abolition of slavery, but we have not abolished slavery, we have only abolished its cruder form: personal slavery (working English)"
    significance: "Ch. II — Henry George quoted at length (from Nikolaev's Russian translation). The governing analogy of the whole essay: land monopoly is the surviving, subtler form of slavery. Tolstoy hands the economic argument to George and adds the Russian gloss himself."
  - id: E4
    genre: works
    pssTom: 36
    pages: "215"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "таково дело милитаризма, война, и таково самое близкое и настоятельное дело — частная земельная собственность"
    quoteEn: "such is the affair of militarism, war, and such is the nearest and most pressing matter — private land property (working English)"
    significance: "Ch. III. Tolstoy files land property in the same list as cannibalism, human sacrifice, judicial torture, serfdom, capital punishment and war — institutions humanity has overcome or is overcoming. The land question is the next on the moral ladder."
  - id: E5
    genre: works
    pssTom: 36
    pages: "216"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "Средство это, употребляемое и до сих пор по отношению к Джорджу, было замалчивание"
    quoteEn: "This means, used to this day with respect to George, was suppression by silence (working English)"
    significance: "Ch. III. The reception story of George himself: Gladstone, Spencer (who recanted his Social Statics and bought up the old editions), Parnell, the Oxford students, the Catholic party and orthodox political economy all turned on him — but the chief weapon was замалчивание, killing the idea by ignoring it. Tolstoy reads George's neglect as proof of his truth."
  - id: E6
    genre: works
    pssTom: 36
    pages: "220"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "Наши грехи всегда перед нами"
    quoteEn: "Our sins are always before us (working English)"
    significance: "Ch. V, after the keystone parable of the penned cows (people keep the cows fenced and devise endless 'improvements' rather than break the fence to the pasture). Russia, unlike colonial Europe, has no distant colony onto which to displace the exploitation — its starving feeders stand in plain sight."
  - id: E7
    genre: works
    pssTom: 36
    pages: "222"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "теперь же люди, делающие такое же зло среди нас, делают это во имя «народа», ради истинного служения ему"
    quoteEn: "now people doing the same evil among us do it in the name of 'the people,' for the sake of truly serving it (working English)"
    significance: "Ch. VI (epigraph Matthew 23:27–28, the whited sepulchres). The structural charge: the liberal/socialist/revolutionary intelligentsia who 'serve the people' are the new Pharisees — the false servants of God reborn as false servants of the народ, sharing the same three signs (loose lives, no real love of the served, mutual anathema)."
  - id: E8
    genre: works
    pssTom: 36
    pages: "224"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "не имеют религии. А без религии человек не может жить сам разумной жизнью"
    quoteEn: "have no religion. And without religion a man cannot himself live a rational life (working English)"
    significance: "Ch. VII. The diagnosis under the diagnosis: governmental and anti-governmental reformers alike miss the one thing the people need because they are without religion, and so cannot truly love and therefore cannot know what others need. The land question is finally a religious question."
  - id: E9
    genre: works
    pssTom: 36
    pages: "226"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "захват земли неработающими людьми есть великий грех"
    quoteEn: "the seizure of land by non-working people is the great sin (working English)"
    significance: "Ch. VII — the title phrase, spoken (in Tolstoy's reading) by the old peasant who, hearing a newspaper article on the 'agrarian' congress read aloud at Tula station, understands nothing of the jargon but grasps that it concerns a great, ancient sin, and crosses himself. The illiterate peasant's gesture carries the essay's whole thesis."
  - id: E10
    genre: works
    pssTom: 36
    pages: "227"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "нужно только сознание своего греха всеми людьми, совершающими его или участвующими в нем, и желание избавления от него"
    quoteEn: "only the consciousness of their sin is needed, by all who commit it or take part in it, and the desire to be free of it (working English)"
    significance: "Ch. VIII. The non-political remedy. What unties the sin is NOT reforms, socialist projects, revolution, or philanthropic land-purchase schemes — only the conscience of those complicit, as with serfdom. The moral-individualist lever asserted against every external programme."
  - id: E11
    genre: works
    pssTom: 36
    pages: "226"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "«Великие общественные преобразования, — говорит Мадзини, — всегда были и будут лишь следствием великих религиозных движений»"
    quoteEn: "'Great social transformations,' says Mazzini, 'always have been and will be only the consequence of great religious movements' (working English)"
    significance: "Ch. VIII epigraph. Tolstoy frames the coming land emancipation as a religious movement, not a political one — borrowing Mazzini (via Nikiforov's Posrednik anthology) to make the historical case."
  - id: E12
    genre: works
    pssTom: 36
    pages: "229"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "при существующем государственном строе и обязательных податях невозможно придумать какого-либо другого лучшего, более справедливого, практического и мирного решения"
    quoteEn: "under the existing state structure and obligatory taxes it is impossible to devise any other better, more just, practical and peaceful solution (working English)"
    significance: "Ch. IX — the keystone clause. Tolstoy endorses George's single tax not absolutely but conditionally: GIVEN the state and its compulsory taxes (institutions he does not himself endorse), this is their most just possible form — the least-unjust shape of an order he still wants abolished, not an embrace of the state. The change he actually calls for is moral (conscience, ch. VIII), not fiscal."
  - id: E13
    genre: works
    pssTom: 36
    pages: "228"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "Освобождение крестьян в России совершено не Александром II, а теми людьми, которые поняли грех крепостного права"
    quoteEn: "The emancipation of the peasants in Russia was accomplished not by Alexander II, but by those people who understood the sin of serfdom (working English)"
    significance: "Ch. IX. The governing historical analogy: serfdom fell (1861) because conscience moved private men — Novikov, Radishchev, the Decembrists — not because the Tsar decreed it. Land emancipation will come the same way, by moral awakening, not by state action. This is how Tolstoy keeps an anti-statist account of a reform that the state would in fact have to administer."
  - id: E14
    genre: works
    pssTom: 36
    pages: "230"
    extract: extracts/v36_206_230_Velikij_greh.txt
    quoteRu: "мы, русские паразиты, вскормленные и получившие досуг для умственной работы трудами народа, поймем наш грех"
    quoteEn: "we, Russian parasites, fed and given leisure for mental work by the labour of the people, will understand our sin (working English)"
    significance: "Ch. IX, the closing sentence. Tolstoy folds himself — the landowner-writer — into the indicted class. The first-person complicity (cf. the 21 April diary, the peasant who reproached him to his face) is the essay's moral signature and the seam between its inward moral demand (conscience; inner activity) and its reform programme."
  # --- the variants (PSS Tom 36, pp. 464–475; pre-reform orthography) ---
  - id: E15
    genre: works
    pssTom: 36
    pages: "474"
    extract: extracts/v36_464_475_Velikij_greh_Varianty.txt
    quoteRu: "жизнь народа слагается не вследствие внешних форм, которые могут быть наложены на него внешними влияниями, а внутренней деятельностью отдельных личностей"
    quoteEn: "the life of the people is formed not as a result of external forms which may be imposed on it by external influences, but by the inner activity of individual persons (working English)"
    significance: "Variant № 15 — the withdrawn first introduction (proof-set for Chertkov's «Свободное слово»). The key sentence of the one paragraph Chertkov took out of this introduction (the introduction was printed in «Свободное слово» No. 17–18 as «Необходимый переворот»; the paragraph printed after it with an editor's note): the people's life is formed by the inner moral activity of individuals, not by external forms imposed from outside. Chertkov's recorded reason (8 July 1905 letter, per the PSS commentary — see E28) was that it stood against the rest of the essay, which insists the external forms of land-use must change. The primary fact, in his circle's own terms; the academic 'anarchism' label is not the dive's. (Pre-reform orthography as in the TEI.)"
  - id: E16
    genre: works
    pssTom: 36
    pages: "473"
    extract: extracts/v36_464_475_Velikij_greh_Varianty.txt
    quoteRu: "Конституция обезпечит право достаточных, праздных, паразитных сословий, но не права народа"
    quoteEn: "The constitution will secure the right of the propertied, idle, parasitic classes, but not the rights of the people (working English)"
    significance: "Variant № 13 (cut). Tolstoy's verdict on the 1905 constitutional movement: a parliament will entrench the propertied, not free the landless. The anti-constitutional edge that the published essay softened. (Pre-reform «обезпечит».)"
  - id: E17
    genre: works
    pssTom: 36
    pages: "471"
    extract: extracts/v36_464_475_Velikij_greh_Varianty.txt
    quoteRu: "есть великий грех, такой же, каким был грех крепостного права и грех не прошедший, a настоящий, и не временный, а постоянно совершаемый"
    quoteEn: "is a great sin, the same as the sin of serfdom was — and a sin not past but present, not temporary but constantly committed (working English)"
    significance: "Variant № 8 (cut). The sharpest statement of the serfdom analogy and of the sin's PRESENT, ongoing character — the landowner re-commits it every day he holds the land. Cut from the final text, where the same idea survives more diffusely."
  # --- composition-history commentary (PSS Tom 36, Gorbachev — attributed) ---
  - id: E18
    genre: commentary
    pssTom: 36
    pages: "656"
    extract: extracts/v36_656_665_Velikij_greh_commentary.txt
    quoteRu: "Статья «Великий грех» создалась в результате скрещения двух замыслов"
    quoteEn: "The article 'The Great Sin' came about as the result of the crossing of two plans — PSS commentary (working English)"
    significance: "Pins the dual genesis: «Народные заступники» (an attack on the intelligentsia 'defenders of the people') + the Henry George essay, merged into one. (Gorbachev, PSS Tom 36 apparatus.)"
  - id: E19
    genre: commentary
    pssTom: 36
    pages: "656"
    extract: extracts/v36_656_665_Velikij_greh_commentary.txt
    quoteRu: "приехал из Англии Чертков, который предложил Толстому сделать в статье ряд сокращений"
    quoteEn: "Chertkov arrived from England and proposed that Tolstoy make a series of cuts in the article — PSS commentary (working English)"
    significance: "The editorial intervention: Chertkov came to Yasnaya Polyana on 24 May 1905 and proposed the cuts (two whole chapters + parts of others); Tolstoy accepted them and regretted it («выбросил многое. Мне жалко»). The cut material is what the PSS prints as variants — including the withdrawn paragraph (E15)."
  - id: E20
    genre: commentary
    pssTom: 36
    pages: "664"
    extract: extracts/v36_656_665_Velikij_greh_commentary.txt
    quoteRu: "с редакционным примечанием, оговаривающим расхождение редакции с автором по существенным и важным вопросам"
    quoteEn: "with an editorial note specifying the editors' divergence from the author on substantial and important questions — PSS commentary (working English)"
    significance: "First publication: July 1905, Русская мысль, with an editorial note disclaiming the editors' agreement with the author on substantial points; reprinted the same year as a Posrednik brochure, in English in The Times, and (as «Великий грех. О земельной собственности») in Chertkov's «Свободное слово» No. 98. First in a collected edition only in 1911 (12th ed., confiscated)."
  - id: E28
    genre: commentary
    pssTom: 36
    pages: "665"
    extract: extracts/v36_656_665_Velikij_greh_commentary.txt
    quoteRu: "абзац этот, утверждающий независимость жизни народа от внешних форм, стоит в противоречии со всем предыдущим, где утверждается необходимость внешнего изменения форм пользования землей"
    quoteEn: "this paragraph, asserting the independence of the people's life from external forms, stands in contradiction with all the preceding, where the necessity of an external change in the forms of land use is asserted — PSS commentary, paraphrasing Chertkov's letter of 8 July 1905 (n.s.) (working English)"
    significance: "Chertkov's RECORDED REASON for setting the one paragraph of the withdrawn first introduction (E15) apart (the introduction was printed in «Свободное слово» No. 17–18 as «Необходимый переворот»; the paragraph printed after it with an editor's note). The primary editorial fact at the heart of the dive: Tolstoy's closest friend and editor judged the inward-only statement to stand against the essay's insistence that the outward forms of land-use must change, and — with Tolstoy's assent — parted the two. Reported in the PSS commentary (Gorbachev); the letter is in АТБ. (In the same letter Chertkov also softened «происходят от» to «связаны с», reasoning that land-property's evil itself springs from a deeper evil, human egoism.)"
  # --- genesis: 1905 diaries (Tom 55) and letters (Tom 89) ---
  - id: E21
    genre: diary
    pssTom: 55
    date: "1905-04-16"
    extract: extracts/v55_134_134_1905_04_16.txt
    quoteRu: "очень хочется и изложение веры и о Генри Джорже, которого прочел по Николаеву и вновь восхищен"
    quoteEn: "I very much want both the exposition of faith and [to write] about Henry George, whom I read in Nikolaev's [translation] and am again delighted by (working English)"
    significance: "The earliest 1905 diary trace of the project — the George strand named, and the renewed enthusiasm (he had championed George since the 1880s) traced to S. D. Nikolaev's translation. The «изложение веры» he names in the same breath is a different work; the two ambitions sit side by side."
  - id: E22
    genre: diary
    pssTom: 55
    date: "1905-04-21"
    extract: extracts/v55_135_137_1905_04_21.txt
    quoteRu: "Начал писать: Народные Заступники. Недурно. И Генри Джоржа"
    quoteEn: "Began writing: The People's Defenders. Not bad. And Henry George (working English)"
    significance: "The composition-start marker and the original title. The two pieces that Gorbachev says were later merged are here still two: «Народные заступники» and the George essay. Sets the dated slug from Old Style 21 April 1905."
  - id: E23
    genre: diary
    pssTom: 55
    date: "1905-04-21"
    extract: extracts/v55_135_137_1905_04_21.txt
    quoteRu: "он жестко упрекал меня за то, что я говорю, а скупаю землю. Было и больно и хорошо"
    quoteEn: "he harshly reproached me for the fact that I speak [against it] yet buy up land. It was both painful and good (working English)"
    significance: "The personal-complicity seam, the same day he began the essay: a peasant (Pyotr Osipov, in the company of A. S. Buturlin) reproached Tolstoy to his face for preaching against land-owning while himself acquiring land. The first-person «мы, русские паразиты» of the closing (E14) is not rhetoric — it is this reproach absorbed."
  - id: E24
    genre: letter
    pssTom: 89
    date: "1905-04-17"
    addressee: "V. G. Chertkov"
    extract: extracts/L_v89_738_Chertkov_1905_04_17.txt
    quoteRu: "как теперь начаты мною о заступниках народа и о неправедности земельной собственности и Генри Джордже"
    quoteEn: "as now begun by me — about the defenders of the people, and about the unrighteousness of land property, and Henry George (working English)"
    significance: "The genesis confirmed to his chief editor the day after the first diary note — the two strands named together. Tolstoy files the piece among «статьи на злобы дня» (topical articles) written «для своего удовлетворения», a self-deprecating register that undersells what became one of his central land statements."
  - id: E25
    genre: diary
    pssTom: 55
    date: "1905-05-04"
    extract: extracts/v55_138_139_1905_05_04.txt
    quoteRu: "За это время окончил Великий Грех"
    quoteEn: "In this time I finished The Great Sin (working English)"
    significance: "First 'finished' marker — two weeks of writing. The title «Великий грех» is now fixed (the «Народные заступники» chapter survives as ch. VI). The revising would run another two months."
  - id: E26
    genre: diary
    pssTom: 55
    date: "1905-06-06"
    extract: extracts/v55_144_146_1905_06_06.txt
    quoteRu: "Сократил Великий Грех, выбросил многое. Мне жалко"
    quoteEn: "I shortened The Great Sin, threw out much. I regret it (working English)"
    significance: "After Chertkov's 24 May–3 June visit. The diary records the author's reluctant assent to the cuts — the regret that makes the variants (E15–E17) more than discarded drafts: they are the essay Tolstoy would have preferred to print."
  - id: E27
    genre: diary
    pssTom: 55
    date: "1905-05-24"
    extract: extracts/v55_140_144_1905_05_24.txt
    quoteRu: "владение землею включает неизбежно власть над людьми, живущими на ней, владение же орудиями труда дает власть только над теми людьми, которые подчиняются этой власти"
    quoteEn: "ownership of land inevitably includes power over the people living on it, whereas ownership of tools of labour gives power only over those people who submit to that power (working English)"
    significance: "A diary note written while finishing the essay — the distinction that separates Tolstoy's land critique from the socialists' war on capital: land monopoly is uniquely coercive because it commands the bodies of those who must live on it. The intellectual ground for putting land, not capital, at the root."

