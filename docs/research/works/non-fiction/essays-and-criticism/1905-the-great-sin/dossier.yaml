# ── Contradictions (intra-corpus: primary vs primary) ────────────────────
contradictions:
  - claim: "In the withdrawn paragraph (variant № 15), Tolstoy writes that the people's life is formed by the inner moral activity of individuals, not by external forms imposed from outside."
    correction: "The published essay insists the EXTERNAL form of land-use must change, and endorses George's single tax as the remedy 'under the existing state structure and obligatory taxes' (E12). Chertkov judged the two to stand in contradiction (8 July 1905 letter, per the commentary — E28) and set the inward-only paragraph apart, printed after the first introduction («Необходимый переворот», «Свободное слово» No. 17–18) with an editor's note — the two emphases parted editorially, with Tolstoy's assent, not reconciled in argument."
    evidenceRef: E15

